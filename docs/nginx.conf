server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Desabilitar redirect automático do nginx (port_in_redirect)
    port_in_redirect on;
    absolute_redirect off;

    # Redirect raiz para /generated-docs
    location = / {
        return 301 /generated-docs/;
    }

    # Redirect /generated-docs para /generated-docs/ (evita redirect automático do nginx)
    location = /generated-docs {
        return 301 /generated-docs/;
    }

    # Arquivos servidos no path /generated-docs
    location /generated-docs/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # Cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|txt)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Configuração para arquivos estáticos
        try_files $uri $uri/ $uri.html /generated-docs/index.html;
    }
}
